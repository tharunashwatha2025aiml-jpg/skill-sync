# ====================================================================
# SkillSync: Test Application Configuration (In-Memory H2 Isolated DB)
# ====================================================================

spring.application.name=skillsync-test

# H2 In-Memory Database with MySQL Compatibility Mode
spring.datasource.url=jdbc:h2:mem:skillsync_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto initialize H2 test schema
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

# Logging
logging.level.com.skillsync=DEBUG
logging.level.org.springframework.jdbc=DEBUG
